services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dentro do docker-compose, o Postgres roda no serviço "postgres",
      # não em localhost -- essa variável sobrescreve o que estiver no .env.
      DATABASE_URL: postgresql+asyncpg://conecta:conecta@postgres:5432/conecta_empresas
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: conecta
      POSTGRES_PASSWORD: conecta
      POSTGRES_DB: conecta_empresas
    ports:
      # 5433 (não 5432) por precaução -- a 27017 do Mongo já colidiu com um
      # serviço nativo do Windows, então evitamos a porta "padrão" de novo
      # pra quem já tiver um Postgres local instalado.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conecta -d conecta_empresas"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
